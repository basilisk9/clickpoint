# fly.toml app configuration file generated for clickpoint on 2026-10-15T08:08:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clickpoint'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  HOSTNAME = '0.0.0.0'
  LOGFARE_BASE_URL = 'https://ai.hackclub.com/proxy/v1'
  LOGFARE_DISABLE_THINKING = 'true'
  LOGFARE_FALLBACK_MODELS = ''
  LOGFARE_MODEL = 'deepseek/deepseek-v4.1-flash'
  PORT = '3000'

[[mounts]]
  source = 'clickpoint_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
