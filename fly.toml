# fly.toml app configuration file generated for clickpoint on 2026-10-15T08:08:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# NOTE: `internal_port` below is 3000, not the 8080 that `fly launch` generates.
# The Dockerfile ends with `ENV PORT=3000` + `EXPOSE 3000`, so the container
# listens on 3000. With 8080 here, Fly's proxy gets connection-refused and every
# request 502s ("instance refused connection") while the app itself logs
# "✓ Ready". If you regenerate this file, check this value first.

app = 'clickpoint'
primary_region = 'ams'

[build]

[env]
  HOSTNAME = '0.0.0.0'
  LOGFARE_BASE_URL = 'https://logfare.ai/v1'
  LOGFARE_DISABLE_THINKING = 'true'
  LOGFARE_FALLBACK_MODELS = ''
  LOGFARE_MODEL = 'deepseek-v4.1-flash-1017'
  LOGFARE_REASONING_EFFORT = 'low'
  PORT = '3000'

# No [[mounts]] block: records live in Postgres (DATABASE_URL), not on a volume.
# The old `clickpoint_data` volume is unused by this code and can be deleted.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
